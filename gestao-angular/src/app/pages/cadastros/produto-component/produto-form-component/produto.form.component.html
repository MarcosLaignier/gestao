<div>
  <toolbar-filter-component [tituloPagina]="'Cadastro de Pessoa'"
                            [listMode]="false"
                            (salvar)="doSave(model)">

  </toolbar-filter-component>
</div>

<tabs-component>
  <tab title="Dados Gerais" icon="bi-box-seam">

    @if (model) {
            <div class="flex-column">
<!--Falta uma forma legal de colocar o status atual do equipamento-->
<!--              Aqui vai cod patrimonio-->

      <text-box-component label="Nome" colClass="col-md-4" [(dataField)]="model.nome"></text-box-component>
      <text-box-component label="Modelo" colClass="col-md-4" [(dataField)]="model.modelo"></text-box-component>

      <div class="d-flex gap-2">
        <date-box-component label="Aquisição" colClass="col-md-2" [(dataField)]="model.dataAquisicao"></date-box-component>
<!--Aqui vai o valor da diaria-->
      </div>

<!--              Aqui vai a observacao-->

              </div>
    }

  </tab>


  <tab title="Locações" icon="bi-clock-history">

  </tab>

</tabs-component>
