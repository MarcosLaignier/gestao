<div class="col-md-4">
  <div class="card shadow-sm h-100">
    <div class="card-body p-3">

      <h6 class="fw-bold mb-2">Detalhes do Produto</h6>

      <div class="row g-2 align-items-start">

        <!-- COLUNA TEXTO -->
        <div class="col-8">
          <div class="text-muted small mb-1">
            Cod: <strong>{{produto.codigoPatrimonio}}</strong>
          </div>

          <div class="fw-semibold mb-2">
            {{produto.nome}}
          </div>

          <div class="mb-2">
            <label class="form-label small mb-1">
              <i class="bi bi-tag"></i> Produto
            </label>
            <div class="text-muted small mb-1">
              {{produto.categoria ? produto.categoria.nome : 'Não Informada'}}
            </div>
          </div>

          <div>
            <label class="form-label small mb-1">Marca</label>
            <div class="text-muted small mb-1">
              {{produto.marca ? produto.marca.nome  : 'Não Informada'}}
            </div>
          </div>
        </div>

        <!-- COLUNA IMAGEM -->
        <div class="col-4 text-center">
          <img
            src="../../../../assets/s21.jpeg"
            alt="Buscar o nome do produto"
            class="img-fluid rounded"
          />
        </div>

      </div>
    </div>
  </div>
</div>
