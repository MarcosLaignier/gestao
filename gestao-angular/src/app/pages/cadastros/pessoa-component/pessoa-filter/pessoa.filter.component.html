<form class="row g-1 p-3 border rounded shadow-sm">

  <div class="flex-column">

    <div class="d-flex flex-row gap-1">
      <text-box-component [label]="'Nome'" [colClass]="'col-md-2'" [(dataField)]="filter.nome" placeholder="Digite o Nome"></text-box-component>
      <text-box-component [label]="'Documento'"  [colClass]="'col-md-2'" [(dataField)]="filter.documento" placeholder="Digite o CPF ou CNPJ"></text-box-component>
    </div>

    <div class="d-flex flex-row gap-1">
      <select-enum [label]="'Situação'" [enumObject]="situacaoEnum" [(dataField)]="filter.situacao"></select-enum>
      <select-enum [label]="'Tipo'" [enumObject]="tipoEnum" [(dataField)]="filter.tipoPessoa"></select-enum>
    </div>

    <div class="d-flex flex-row gap-1">
      <date-box-component [label]="'Nascimento de'" [colClass]="'col-md-1'" [(dataField)]="filter.nascimentoInicio"></date-box-component>
      <date-box-component [label]="'Nascimento Até'" [colClass]="'col-md-1'" [(dataField)]="filter.nascimentoFim"></date-box-component>
    </div>


    <!--    Caso precise colocar novos filters criar a div com este seletor-->
    <ng-content select="[extra-filters]"></ng-content>  </div>
</form>
