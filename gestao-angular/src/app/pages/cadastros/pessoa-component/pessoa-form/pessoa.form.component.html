<div>
  <toolbar-filter-component [tituloPagina]="'Cadastro de Pessoa'"
                            [listMode]="false"
                            (salvar)="doSave(model)">

  </toolbar-filter-component>
</div>

<tabs-component>
  <tab title="Dados Gerais" icon="bi-person">

    @if (model) {
      <div class="flex-column">
        <radio-enum [enumObject]="tipoPessoaEnumType"
                    label="Tipo Pessoa"
                    [(dataField)]="model.tipoPessoa"
                    [inline]="true">
        </radio-enum>

        <div class="d-flex gap-2">
          <text-box-component label="Nome" colClass="col-md-2" [(dataField)]="model.nome"></text-box-component>
          <text-box-component label="Documento" colClass="col-md-2" [(dataField)]="model.documento"></text-box-component>
        </div>
        <div class="d-flex gap-2">
          <date-box-component label="Nascimento" colClass="col-md-2" [(dataField)]="model.nascimento"></date-box-component>
          <select-enum label="Sexo" [enumObject]="sexoEnumType" [(dataField)]="model.sexo" ></select-enum>
        </div>
        <div class="d-flex gap-2">
          <text-box-component label="Email" colClass="col-md-2" [(dataField)]="model.email"></text-box-component>
          <select-enum label="Situação" [enumObject]="situacaoEnumType" [(dataField)]="model.situacao" colClass="col-md-2"></select-enum>
        </div>


      </div>
    }

  </tab>

  <tab title="Endereço" icon="bi-geo-alt">

    <div class="card mb-3">
      <div class="card-header py-2 fw-semibold">
        Novo Endereço
      </div>

      <form class="row g-1 p-3 border rounded shadow-sm">
        <text-box-component label="CEP" colClass="col-md-2" [(dataField)]="enderecoSelected.cep"></text-box-component>

        <div class="d-flex flex-row gap-1">
          <text-box-component label="Logradouro" colClass="col-md-4" [(dataField)]="enderecoSelected.logradouro"></text-box-component>
          <text-box-component label="Número" colClass="col-md-2" [(dataField)]="enderecoSelected.numero"></text-box-component>
          <text-box-component label="Complemento" colClass="col-md-3" [(dataField)]="enderecoSelected.complemento"></text-box-component>
        </div>

        <div class="d-flex flex-row gap-1">
          <text-box-component label="Bairro" colClass="col-md-3" [(dataField)]="enderecoSelected.bairro"></text-box-component>
          <text-box-component label="Cidade" colClass="col-md-3">
            <!--            [(dataField)]="enderecoSelected.cidade"-->
          </text-box-component>
          <text-box-component label="Ponto de Referência" colClass="col-md-3" [(dataField)]="enderecoSelected.pontoReferencia"></text-box-component>
        </div>

        <div class="col-md-2 d-flex">
          <button type="button"
                  class="btn btn-outline-primary px-4"
                  (click)="adicionaEndereco()" >
            <i class="bi bi-plus-circle me-1"></i>
            Adicionar
          </button>
        </div>
      </form>
    </div>

    <grid-component
      [titleGridVisible]="true"
      titleGrid="Endereços Cadastrados"
      [typeDataSource]="enderecoTypeGrid"
      [dataSource]="model.enderecoList">

    </grid-component>

  </tab>


  <tab title="Contatos" icon="bi-telephone">

    <div class="card mb-3">
      <div class="card-header fw-semibold">
        Novo Contato
      </div>

      <div class="card-body">
        <div class="row align-items-end g-3">
          <text-box-component label="Número" colClass="col-md-3" [(dataField)]="telefoneSelected.numero"></text-box-component>
          <div class="col-md-3">
            <switch-component [label]="'Contato Principal'" [(dataField)]="telefoneSelected.principal" colClass="col-md-3"></switch-component>
          </div>

          <div class="col-md-3">
            <switch-component [label]="'Contato Notificação'" [(dataField)]="telefoneSelected.isWhatsappNotifica" colClass="col-md-3"></switch-component>
          </div>

          <div class="col-md-3 text-end">
            <button type="button" class="btn btn-outline-primary w-100" (click)="adicionaContato()">
              <i class="bi bi-plus-circle"></i>
              Adicionar Contato</button>
          </div>

        </div>
      </div>
    </div>

    <grid-component [titleGridVisible]="true"
                    [titleGrid]="'Contatos Cadastrados'"
                    [typeDataSource]="contatoTypeGrid"
                    [dataSource]="model.telefoneList">
    </grid-component>

  </tab>

</tabs-component>
