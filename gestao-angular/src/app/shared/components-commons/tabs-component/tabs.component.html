<ul class="nav nav-tabs custom-tabs">
  @for (tab of tabs; track tab) {
    <li class="nav-item">
      <button
        type="button"
        class="nav-link"
        [class.active]="tab.active"
        [class.disabled]="tab.disabled"
        (click)="selectTab(tab)">
        {{ tab.title }}
      </button>
    </li>
  }
</ul>

<div class="mt-3">
  <ng-content />
</div>
