<div class="{{ colClass || 'col-md-4' }}">
  <label class="form-label">{{ label + ':'}}</label>

  <div *ngFor="let opt of enumOptions"
       class="form-check"
       [ngClass]="{ 'form-check-inline': inline }">

    <input
      class="form-check-input"
      type="radio"
      [name]="label"
      [id]="label + '_' + opt.key"
      [value]="opt.key"
      [checked]="dataField === opt.key"
      (change)="dataField = opt.key">

    <label class="form-check-label" [for]="label + '_' + opt.key">
      {{ opt.value }}
    </label>
  </div>
</div>
